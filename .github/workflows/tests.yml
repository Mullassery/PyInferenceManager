name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Test workspace
        run: cargo test --workspace --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true # not blocking on day one: this repo has 100+ pre-existing warnings to clean up separately

  maturin-build:
    name: Build Python extension (maturin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: pip install maturin

      - name: Build extension
        run: maturin build --release -m crates/pyinferencemanager-py/Cargo.toml

      - name: Install and smoke-test import
        run: |
          pip install target/wheels/*.whl
          python -c "import pyinferencemanager; print('import OK')"
