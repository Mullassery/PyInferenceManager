name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Test workspace
        run: cargo test --workspace --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true # not blocking on day one: this repo has 100+ pre-existing warnings to clean up separately

  maturin-build:
    name: Build Python extension (maturin) & run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install maturin and test dependencies
        run: pip install maturin pytest pytest-asyncio

      - name: Build extension
        run: maturin build --release -m crates/pyinferencemanager-py/Cargo.toml

      - name: Install and smoke-test import
        run: |
          pip install target/wheels/*.whl
          python -c "import pyinferencemanager; print('import OK')"

      - name: Run Python test suite
        # No live API keys or Ollama in CI — Orchestrator.run() is designed
        # to gracefully degrade (return a result explaining the failure)
        # rather than raise when a backend is unreachable, so the suite
        # exercises real code paths (construction, plan/run/provider
        # ranking, MCP tool wiring, budget/retry/load-test bindings,
        # connector security defaults) without needing secrets.
        run: pytest tests/ -v
